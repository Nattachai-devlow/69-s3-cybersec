services:
  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: 69-s3-db
    ports:
      - "${BIND_IP}:${DATABASE_PORT}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./data-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4:9.16@sha256:40fa840c5bb7c8463957f1255b01283732c2d8c9396a956d180f8e6c296753b3
    container_name: 69-s3-admin
    ports:
      - "${BIND_IP}:${PGADMIN_PORT}:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      - db
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./config/servers.json:/pgadmin4/servers.json

  app:
    build: .
    container_name: 69-s3-app
    ports:
      - "${BIND_IP}:${APP_PORT}:1337"
    # เช็คว่ามี module หรือยัง ถ้ายังไม่มีให้ yarn add ก่อนแล้วค่อย start
    command: yarn start
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1337/_health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - DATABASE_CLIENT=${DATABASE_CLIENT}
      - DATABASE_NAME=${POSTGRES_DB}
      - DATABASE_HOST=${MY_LOCALHOST}
      - DATABASE_PORT=${DATABASE_PORT_APP}
      - DATABASE_USERNAME=${POSTGRES_USER}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - APP_KEYS=${APP_KEYS}
      - API_TOKEN_SALT=${API_TOKEN_SALT}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      - TRANSFER_TOKEN_SALT=${TRANSFER_TOKEN_SALT}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./strapi-uploads:/opt/app/public/uploads
      - ./config/plugins.js:/opt/app/config/plugins.js
      - ./config/admin.js:/opt/app/config/admin.js
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
  mailhog:
    image: mailhog/mailhog@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    container_name: 69-s3-mailhog
    ports:
      - "${BIND_IP}:1025:1025"
      - "${BIND_IP}:8025:8025"
volumes:
  pgadmin-data:
