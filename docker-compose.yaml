services:
  db:
    image: postgres:16-alpine
    container_name: 69-s3-db
    ports:
      - 54399:5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./data-postgres:/var/lib/postgresql/data #ผูก Volume เพื่อเก็บข้อมูล database
  pgadmin:
    image: dpage/pgadmin4:9.16
    container_name: 69-s3-admin
    ports:
      - 8000:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL} # อีเมลสำหรับใช้ Login เข้า pgAdmin
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD} # รหัสผ่านสำหรับใช้ Login เข้า pgAdmin
    depends_on: #เป็นการบอก Docker ว่าให้รัน Service db (PostgreSQL) ให้เสร็จก่อน ค่อยรัน pgadmin ตามมา
      - db

#Define Using Systems in Volume
volumes:
  data-postgres:
